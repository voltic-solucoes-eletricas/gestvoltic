<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6b8c">
<title>GestVoltic</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--azul:#0e6b8c;--azul2:#2346d6;--fundo:#eef3f6;--cartao:#fff;--texto:#17323f;--suave:#5b6b75;--linha:#dde5ea;--verde:#1d6b2f;--vermelho:#b3261e;--amarelo:#fff4d6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);font-size:15px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;padding:10px 14px calc(10px);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:14px}
main{padding:12px 12px 90px;max-width:900px;margin:0 auto}
nav.abas{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.abas button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.abas button b{font-size:20px;font-weight:400;line-height:1}
nav.abas button.on{color:var(--azul2);font-weight:700}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:12px;margin:0 0 10px}
.cartao h2,.cartao h3{margin:0 0 8px;font-size:16px}
.grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.num{background:#f4f8fb;border-radius:10px;padding:8px 10px}.num span{display:block;font-size:12px;color:var(--suave)}.num b{font-size:22px}
.num.alerta b{color:var(--vermelho)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.btn{background:var(--azul2);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
.btn.sec{background:#e3ebf0;color:var(--texto)}
.btn.peq{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=text],input[type=tel],input[type=email],input[type=number],input[type=password],select,textarea{width:100%;padding:10px;border:1px solid #9fb3bf;border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:120px;resize:vertical}
label.campo{display:block;margin:0 0 10px;font-size:13px;color:var(--suave)}label.campo>span{display:block;margin-bottom:4px;font-weight:600;color:var(--texto)}
.lista{list-style:none;margin:0;padding:0}
.lista li{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.lista li.toque{cursor:pointer}
.lista .t{font-weight:700}.lista .s{font-size:13px;color:var(--suave)}
.chip{display:inline-block;font-size:12px;border-radius:20px;padding:2px 9px;background:#e8eef2;margin:2px 4px 2px 0}
.chip.ok{background:#e2f3e2;color:var(--verde)}.chip.mau{background:#fbe3e1;color:var(--vermelho)}.chip.am{background:var(--amarelo);color:#5b4500}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.filtros button{white-space:nowrap;border:1px solid #9fb3bf;background:#fff;border-radius:20px;padding:5px 12px;font-size:13px}
.filtros button.on{background:var(--azul2);border-color:var(--azul2);color:#fff}
.det dt{font-size:12px;color:var(--suave);margin-top:8px}.det dd{margin:2px 0 0}
a{color:var(--azul2)}
.aviso{background:var(--amarelo);border:1px solid #e3c46b;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.nota{font-size:12px;color:var(--suave)}
.erro{color:var(--vermelho);min-height:1.2em}
.centro{max-width:360px;margin:12vh auto 0;text-align:center}
.centro input{text-align:center;font-size:24px;letter-spacing:6px}
.cat img{width:100%;border-radius:8px;border:1px solid var(--linha);margin-bottom:8px;background:#fff}
canvas.desenho{width:100%;height:340px;background:#fff;border:1px solid #9fb3bf;border-radius:10px;touch-action:none;display:block}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:6px}
.fotos div{position:relative}.fotos img{width:100%;height:90px;object-fit:cover;border-radius:8px}
.fotos button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:26px;height:26px;background:#000a;color:#fff}
.voltar{background:none;border:0;color:var(--azul2);padding:4px 0;margin-bottom:6px;font-size:15px}
/* ferramentas (os mesmos módulos do PC) */
.vce-seps,.vve-seps{display:flex;gap:6px;flex-wrap:wrap}
.vce-seps button,.vve-seps button{border:1px solid #9fb3bf;background:#fff;border-radius:20px;padding:6px 12px;font-size:13px}
.vce-t,.vve-t{width:100%}
@media (min-width:700px){main{padding:16px 16px 90px}}
</style>
</head>
<body>
<div id="raiz"><p style="padding:20px">A abrir…</p></div>
<script src="rtiebt.js"></script>
<script src="calculos.js"></script>
<script src="carregamento.js"></script>
<script src="app.js"></script>
</body>
</html>
