<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Voltic — Pedido de informações</title>
<style>
  :root { --azul: #1f4e6b; --azul2: #2346d6; --fundo: #f3f6f9; --texto: #1d2a33; --cinza: #5b6b77; --borda: #cfd9e1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.45 "Segoe UI", Calibri, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .cab { display: flex; align-items: center; gap: 14px; border-bottom: 3px solid var(--azul2); padding: 8px 0 12px; margin-bottom: 14px; }
  .cab img { width: 140px; height: auto; }
  h1 { font-size: 21px; margin: 0; }
  .ref { color: var(--cinza); font-size: 14px; }
  .intro { background: #fff; border: 1px solid var(--borda); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .q { background: #fff; border: 1px solid var(--borda); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .q label.t { display: block; font-weight: 600; margin-bottom: 6px; }
  .q textarea, .q input[type=text] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--borda); border-radius: 6px; background: #fffbe6; }
  .q textarea { min-height: 64px; resize: vertical; }
  .op { display: block; padding: 4px 0; }
  .op input { margin-right: 8px; transform: scale(1.15); }
  button { background: var(--azul); color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font: 600 17px "Segoe UI", Arial, sans-serif; cursor: pointer; width: 100%; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin: 12px 0; padding: 12px 14px; border-radius: 8px; }
  .ok { background: #e7f6ec; border: 1px solid #9fd3b0; }
  .erro { background: #fdeaea; border: 1px solid #e6a5a5; }
  .rodape { color: var(--cinza); font-size: 13px; text-align: center; margin: 18px 0 8px; }
</style>
